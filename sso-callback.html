<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating SSO - BaMbooChain</title>
    <style>
        body { background: #111827; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top-color: #fbbf24; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Memproses Autentikasi...</h2>
        <p id="status-text">Sedang memverifikasi token SSO BambooChain Anda.</p>
    </div>

    <script type="module">
        import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from "./firebase-config.js";

        async function handleSSO() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const statusEl = document.getElementById('status-text');

            if (!token) {
                statusEl.textContent = "Token tidak ditemukan. Mengalihkan kembali ke portal login...";
                setTimeout(() => {
                    window.location.replace("https://bamboochain.id/#/login");
                }, 2000);
                return;
            }

            try {
                await signInWithCustomToken(auth, token);
                statusEl.textContent = "Login SSO Berhasil! Mengalihkan ke Dasbor...";
                
                window.history.replaceState({}, document.title, "/");
                
                setTimeout(() => {
                    window.location.replace("/");
                }, 500);
            } catch (error) {
                console.error("SSO Error:", error);
                statusEl.textContent = "Gagal memverifikasi token. Sesi mungkin kedaluwarsa. Mengalihkan...";
                setTimeout(() => {
                    window.location.replace("https://bamboochain.id/#/login");
                }, 3000);
            }
        }

        handleSSO();
    </script>
</body>
</html>
